<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>選擇桌號</title>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
    }
    .container {
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 8px;
    }
    select {
      border: 1px solid #ccc;
    }
    button {
      background-color: #06C755; /* LINE 綠 */
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background-color: #05b34c;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>請選擇桌號</h3>
  
  <select id="tableSelect">
    <!-- 動態生成 1 桌 ~ 20 桌 -->
  </select>

  <button onclick="submitTable()">確認送出</button>
</div>

<script>
  // 請替換為您在 LINE Login 控制台取得的 LIFF ID
const myLiffId = "YOUR_LIFF_ID"; 

document.addEventListener("DOMContentLoaded", function () {
  // 動態生成 1~20 桌選項
  const selectEl = document.getElementById('tableSelect');
  for (let i = 0; i <= 20; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    if(i==0){opt.textContent = '主桌';} else {opt.textContent = `第 ${i} 桌`;}
    
    selectEl.appendChild(opt);
  }

  // 初始化 LIFF
  liff.init({ liffId: myLiffId })
    .then(() => {
      // 檢查是否已登入
      if (!liff.isLoggedIn()) {
        // 若未登入，引導登入
        liff.login();
      }
    })
    .catch((err) => {
      console.error("LIFF 初始化失敗：", err);
      alert("LIFF 初始化失敗：" + err.message);
    });
});

function submitTable() {
  // 再次確保已登入
  if (!liff.isLoggedIn()) {
    alert("尚未登入，請先登入 LINE 帳號！");
    liff.login();
    return;
  }

  const selectedTable = document.getElementById('tableSelect').value;
  const messageText = `第${selectedTable}桌人員`;

  // 傳送訊息
  liff.sendMessages([
    {
      type: 'text',
      text: messageText
    }
  ]).then(() => {
    liff.closeWindow(); // 成功後關閉視窗
  }).catch((err) => {
    console.error("發送失敗：", err);
    alert("發送失敗：" + err.message);
  });
}
</script>

</body>
</html>
